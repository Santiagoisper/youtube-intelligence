services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: youtube_radar
      POSTGRES_DB: youtube_radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - youtube-radar-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youtube_radar -d youtube_radar"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - private

  app:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://youtube_radar:${POSTGRES_PASSWORD}@database:5432/youtube_radar
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      YOUTUBE_COOKIES_FILE: /app/secrets/youtube-cookies.txt
      TRANSCRIPT_OUTPUT_DIR: /app/data/transcripts
      APP_ENV: production
      NODE_ENV: production
    ports:
      - "127.0.0.1:3138:3000"
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    networks:
      - private

volumes:
  youtube-radar-db:

networks:
  private:
